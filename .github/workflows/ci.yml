name: CI/CD Pipeline — TumiFact

on:
  push:
    branches: [ main, dev, "feature/**" ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-coverage:
    name: Run Test Suite & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tumifact_user
          POSTGRES_PASSWORD: tumifact_password
          POSTGRES_DB: tumifact_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tumifact_user -d tumifact_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro Production Application
        run: pnpm build

      - name: Initialize Test Database & Schema
        run: node tests/db-test-setup.js
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: tumifact_user
          DB_PASSWORD: tumifact_password
          DB_DATABASE: tumifact_test

      - name: Run Unit & Integration Tests with Coverage
        run: pnpm test:coverage
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: tumifact_user
          DB_PASSWORD: tumifact_password
          DB_DATABASE: tumifact_test

      - name: Upload Coverage Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
