name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fruver_user
          POSTGRES_PASSWORD: fruver_password
          POSTGRES_DB: ecl_fruver
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Create test database and run schema
        run: node tests/db-test-setup.js
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: fruver_user
          DB_PASSWORD: fruver_password
          DB_DATABASE: ecl_fruver_test

      - name: Run tests
        run: pnpm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: fruver_user
          DB_PASSWORD: fruver_password
          DB_DATABASE: ecl_fruver_test
