# Docker Compose para TumiFact - PostgreSQL 18.4
# Uso: docker compose up -d
# Logs: docker compose logs -f postgres
# Stop: docker compose down

services:
  postgres:
    image: postgres:18-alpine
    container_name: tumifact_db
    
    # Variables de entorno para inicialización
    environment:
      POSTGRES_USER: tumifact_user
      POSTGRES_PASSWORD: tumifact_password
      POSTGRES_DB: tumifact_db
      POSTGRES_INITDB_ARGS: "-c log_statement=all"
    
    # Puertos
    ports:
      - "5432:5432"
    
    # Volúmenes para persistencia y schema
    volumes:
      - tumifact_postgres_data:/var/lib/postgresql
      - ./database_pg.sql:/docker-entrypoint-initdb.d/init.sql
    
    # Health check para verificar que está listo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tumifact_user -d tumifact_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    # Red personalizada
    networks:
      - tumifact_network
    
    # Reinicio automático
    restart: unless-stopped
    
    # Logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Red personalizada para facilitar comunicación entre servicios
networks:
  tumifact_network:
    driver: bridge

# Volúmenes
volumes:
  tumifact_postgres_data:
    driver: local
